name: Sync fork with upstream

on:
  schedule:
    - cron: '22 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-fork-main
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'Willxup/Cli-Proxy-API-Management-Center'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Sync main with upstream
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST \
            -H "Accept: application/vnd.github+json" \
            "repos/${GITHUB_REPOSITORY}/merge-upstream" \
            -f branch=main
